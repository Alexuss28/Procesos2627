<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi aplicación</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    input, button, select { padding: .5rem; margin: .25rem 0; }
    input, select { display: block; width: 100%; box-sizing: border-box; }
    input[type=radio] { display: inline; width: auto; margin-right: .25rem; }
    label { display: block; margin-top: .5rem; font-size: .9rem; color: #444; }
    .error { color: #b00020; } .ok { color: #1b7f3b; }
    table { width: 100%; border-collapse: collapse; } td, th { border-bottom: 1px solid #ddd; padding: .4rem; text-align: left; }
    .oculto { display: none; }
    .barra { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <h1>Mi aplicación</h1>
  <p id="mensaje" role="alert"></p>

  <section id="vista-acceso">
    <h2>Iniciar sesión</h2>
    <input id="login-email" type="email" placeholder="Email">
    <input id="login-password" type="password" placeholder="Contraseña">
    <button id="btn-login">Entrar</button>
    <button id="btn-reenviar" class="oculto">Reenviar correo de confirmación</button>
    <button id="btn-google">Continuar con Google</button>

    <h2>Crear cuenta</h2>
    <input id="reg-email" type="email" placeholder="Email">
    <input id="reg-password" type="password" placeholder="Contraseña (mín. 8 caracteres)">
    <button id="btn-registro">Registrarme</button>
  </section>

  <section id="vista-panel" class="oculto">
    <p>Sesión iniciada como <strong id="panel-email"></strong> (<span id="panel-rol"></span>)</p>
    <button id="btn-logout">Cerrar sesión</button>
    <button id="btn-borrar-cuenta">Eliminar mi cuenta</button>

    <div id="zona-admin" class="oculto">
      <h2>Usuarios</h2>
      <table>
        <thead><tr><th>Email</th><th>Rol</th><th>Estado</th><th></th></tr></thead>
        <tbody id="tabla-usuarios"></tbody>
      </table>
    </div>

    <section id="zona-turnos" class="oculto">
      <h2>Turnos</h2>
      <div class="barra">
        <button id="t-anterior">&larr; Anterior</button>
        <strong id="t-semana"></strong>
        <button id="t-siguiente">Siguiente &rarr;</button>
        <button id="t-hoy">Hoy</button>
      </div>
      <div class="barra">
        <label id="t-opcion-mios"><input type="radio" name="t-vista" value="mios" checked> Mis turnos</label>
        <label><input type="radio" name="t-vista" value="equipo"> Equipo</label>
      </div>
      <table>
        <thead><tr><th>Empleado</th><th>Inicio</th><th>Fin</th><th>Nota</th><th></th></tr></thead>
        <tbody id="t-tabla"></tbody>
      </table>
      <p id="t-vacio" class="oculto">No hay turnos esta semana.</p>

      <div id="t-admin" class="oculto">
        <h3 id="t-form-titulo">Nuevo turno</h3>
        <label for="t-empleado">Empleado</label>
        <select id="t-empleado"></select>
        <label for="t-inicio">Inicio</label>
        <input id="t-inicio" type="datetime-local">
        <label for="t-fin">Fin</label>
        <input id="t-fin" type="datetime-local">
        <label for="t-nota">Nota (opcional)</label>
        <input id="t-nota" type="text" maxlength="200">
        <button id="t-guardar">Crear turno</button>
        <button id="t-cancelar" class="oculto">Cancelar edición</button>
      </div>

      <h3>Disponibilidad</h3>
      <p>Consulta quién está libre en una franja horaria.</p>
      <label for="t-disp-inicio">Desde</label>
      <input id="t-disp-inicio" type="datetime-local">
      <label for="t-disp-fin">Hasta</label>
      <input id="t-disp-fin" type="datetime-local">
      <button id="t-buscar-disp">Consultar</button>
      <ul id="t-disp-resultado"></ul>
    </section>
  </section>

  <script src="rest.js"></script>
  <script src="turnos.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    let yo = null;

    function mostrar(texto, tipo = 'error') {
      const m = $('mensaje');
      m.textContent = texto || '';
      m.className = tipo;
    }

    async function accion(fn) {
      $('btn-reenviar').classList.add('oculto');
      try {
        mostrar('');
        await fn();
      } catch (e) {
        mostrar(e.message);
        // Si la cuenta está pendiente se ofrece reenviar el correo
        if (e.codigo === 'CUENTA_PENDIENTE') $('btn-reenviar').classList.remove('oculto');
      }
    }

    function pintarVista() {
      $('vista-acceso').classList.toggle('oculto', Boolean(yo));
      $('vista-panel').classList.toggle('oculto', !yo);
      if (!yo) { Turnos.limpiar(); return; }
      $('panel-email').textContent = yo.email;
      $('panel-rol').textContent = yo.rol;
      const esAdmin = yo.rol === 'administrador';
      $('zona-admin').classList.toggle('oculto', !esAdmin);
      if (esAdmin) cargarUsuarios();
      Turnos.iniciar(yo);
    }

    async function cargarUsuarios() {
      const usuarios = await Rest.listarUsuarios();
      const tbody = $('tabla-usuarios');
      tbody.replaceChildren();
      for (const u of usuarios) {
        const fila = document.createElement('tr');
        for (const dato of [u.email, u.rol, u.estado]) {
          const td = document.createElement('td');
          td.textContent = dato; // textContent evita inyección de HTML
          fila.appendChild(td);
        }
        const acciones = document.createElement('td');
        const bActivo = document.createElement('button');
        bActivo.textContent = '¿Activo?';
        bActivo.onclick = () => accion(async () => {
          const r = await Rest.estaActivo(u.id);
          mostrar(`${u.email}: ${r.activo ? 'activo' : 'no activo'}`, 'ok');
        });
        const bBorrar = document.createElement('button');
        bBorrar.textContent = 'Eliminar';
        bBorrar.onclick = () => accion(async () => {
          if (!confirm(`¿Eliminar a ${u.email}?`)) return;
          await Rest.eliminarUsuario(u.id);
          if (u.id === yo.id) { yo = null; pintarVista(); } else { await cargarUsuarios(); }
        });
        acciones.append(bActivo, bBorrar);
        fila.appendChild(acciones);
        tbody.appendChild(fila);
      }
    }

    $('btn-login').onclick = () => accion(async () => {
      yo = await Rest.login($('login-email').value, $('login-password').value);
      pintarVista();
    });

    $('btn-registro').onclick = () => accion(async () => {
      const u = await Rest.registrar($('reg-email').value, $('reg-password').value);
      mostrar(u.estado === 'pendiente'
        ? 'Cuenta creada. Te hemos enviado un correo de confirmación (revisa también la carpeta de spam).'
        : 'Cuenta creada. Ya puedes iniciar sesión.', 'ok');
    });

    $('btn-reenviar').onclick = () => accion(async () => {
      await Rest.reenviarConfirmacion($('login-email').value);
      mostrar('Si la cuenta existe y está pendiente, te hemos enviado un nuevo correo.', 'ok');
    });

    $('btn-google').onclick = () => { location.href = Rest.urlAccesoGoogle; };

    $('btn-logout').onclick = () => accion(async () => {
      await Rest.logout();
      yo = null;
      pintarVista();
    });

    $('btn-borrar-cuenta').onclick = () => accion(async () => {
      if (!confirm('¿Seguro que quieres eliminar tu cuenta?')) return;
      await Rest.eliminarUsuario(yo.id);
      yo = null;
      pintarVista();
    });

    // Mensajes para los códigos de error que devuelve el servidor tras volver de Google
    const MENSAJES_OAUTH = {
      oauth_cancelado: 'Has cancelado el acceso con Google.',
      oauth_invalido: 'No se pudo validar el acceso con Google. Inténtalo de nuevo.',
      oauth_error: 'Ha ocurrido un error con Google. Inténtalo de nuevo más tarde.',
      oauth_no_configurado: 'El acceso con Google no está disponible ahora mismo.',
      email_en_uso_local: 'Ya existe una cuenta con ese correo registrada con contraseña. Inicia sesión con tu contraseña.',
      email_no_verificado: 'Google indica que ese correo no está verificado.',
    };

    // Al cargar: mostrar errores de Google, confirmar la cuenta si llega con ?token=... y recuperar la sesión
    (async () => {
      const params = new URLSearchParams(location.search);
      const error = params.get('error');
      const token = params.get('token');
      if (error || token) history.replaceState(null, '', location.pathname); // limpia la barra de direcciones
      if (error) mostrar(MENSAJES_OAUTH[error] || 'No se pudo completar el acceso con Google.');
      if (token) {
        await accion(async () => {
          await Rest.confirmar(token);
          mostrar('Cuenta confirmada. Ya puedes iniciar sesión.', 'ok');
        });
      }
      try { yo = await Rest.sesion(); } catch (_) { yo = null; }
      pintarVista();
    })();
  </script>
</body>
</html>
